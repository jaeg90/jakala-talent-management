# Puertas deterministas del arnés (ADR-0005) para todo lo que llega a main.
# E2E y SonarQube quedan fuera: necesitan browsers/servidor local; en local se ejecutan con `npm run quality`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  puertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
