# SonarQube — análisis de calidad estático de JTM (arnés de calidad, ver AGENTS.md).
# Único ajuste que varía por instalación: SONAR_HOST_URL (default http://localhost:9000)
# y SONAR_TOKEN (ver docker-compose.sonar.yml para levantar el servidor local).

sonar.projectKey=jtm
sonar.projectName=JTM — Jakala Talent Management
sonar.projectVersion=0.1.0

# Monorepo: código de los tres paquetes y sus tests.
sonar.sources=server/src,web/src,piloto/src
sonar.tests=server/test,piloto/test,e2e
sonar.exclusions=**/dist/**,**/node_modules/**

# Puerta de calidad: el scanner espera el veredicto y falla si la puerta queda en rojo
# (la puerta "Sonar way" incorporada marca los issues bloqueantes). Si el servidor no
# está disponible, scripts/sonar-scan.mjs informa SKIP en lugar de fallar.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=180